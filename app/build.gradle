apply plugin: 'com.android.application'

// The release signing config is only attached if the keystore actually exists on disk.
// This means debug builds work even on a fresh checkout, and release will still sign
// when you have the keystore file in place.
def releaseKeystore = file('../../../ssh/com.munger.debug-keystore.jks')
def hasReleaseKeystore = releaseKeystore.exists()

android {
    if (hasReleaseKeystore) {
        signingConfigs {
            config {
                storeFile releaseKeystore
                storePassword '1600 Amphitheatre Parkway'
                keyAlias 'key0'
                keyPassword '1600 Amphitheatre Parkway'
            }
        }
    }
    compileSdkVersion 35
    ndkVersion '25.1.8937393'
    defaultConfig {
        applicationId "com.munger.passwordkeeper"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.config
            }
        }
        debug {
            // Use the standard debug keystore Gradle generates automatically.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        checkReleaseBuilds true
        abortOnError false
    }
    externalNativeBuild {
        cmake {
            path '../libpasswordkeeper/CMakeLists.txt'
        }
    }
    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/LICENSE.md',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/NOTICE.md',
                    'META-INF/notice.txt',
                    'META-INF/ASL2.0',
                    'META-INF/INDEX.LIST',
                    'META-INF/io.netty.versions.properties',
                    'META-INF/*.kotlin_module'
            ]
        }
    }
    namespace 'com.munger.passwordkeeper'
}

afterEvaluate { project ->
    if (hasReleaseKeystore) {
        project.tasks.assembleDebugAndroidTest {
            description = "builds a debuggable test apk"
            doLast {
                def rootDir = project.rootDir
                def localProperties = new File(rootDir, "local.properties")
                def sdkDir = '.'
                if (localProperties.exists()) {
                    Properties properties = new Properties()
                    localProperties.withInputStream { instr ->
                        properties.load(instr)
                    }
                    sdkDir = properties.getProperty('sdk.dir')
                }

                exec {
                    commandLine sdkDir + '/build-tools/34.0.0/apksigner',
                            'sign', '--ks', android.signingConfigs.config.storeFile,
                            '--ks-pass', 'pass:' + android.signingConfigs.config.storePassword,
                            './build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
                }
            }
        }
    }
}

// Repositories are declared centrally in settings.gradle (dependencyResolutionManagement).
// Do NOT add a `repositories {}` block here — it would either trigger
// FAIL_ON_PROJECT_REPOS or, in older Gradle modes, replace the centralized repos and
// break dependency resolution.

dependencies {
    // ---- Kotlin stdlib alignment ----
    // kotlin-stdlib-jdk7/jdk8 were merged into kotlin-stdlib in Kotlin 1.8.
    // Old transitive deps still ask for them at 1.6.x, which collides with the
    // 1.8.x kotlin-stdlib pulled in by newer libs. Forcing them to the same
    // version turns them into empty pass-through artifacts.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib-jdk7 was merged into kotlin-stdlib in 1.8.0'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib-jdk8 was merged into kotlin-stdlib in 1.8.0'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') {
            because 'align kotlin-stdlib across all transitive deps'
        }
    }

    // ---- App runtime dependencies ----
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Google Drive client (2.x line). DriveHelper.java was switched from
    // JacksonFactory -> GsonFactory to match.
    implementation 'com.google.api-client:google-api-client:2.7.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.36.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20240809-2.0.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    implementation project(':libpasswordkeeper')

    // ---- Unit test (JVM) ----
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    // PowerMock removed: not compatible with JDK 17 / Mockito 4+. If you actually
    // need to mock static methods, switch to mockito-inline.

    // ---- Instrumented test (on-device) ----
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.annotation:annotation:1.7.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'org.hamcrest:hamcrest-library:2.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'org.mockito:mockito-android:4.11.0'
    // dexmaker-mockito / crittercism dexmaker removed — abandoned in 2014, replaced by mockito-android.
}
